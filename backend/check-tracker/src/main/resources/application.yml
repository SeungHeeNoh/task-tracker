server:
  port: 8080

spring:
  application:
    name: check-tracker
  datasource:
    hikari:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3300/taskTracker?serverTimezone=Asia/Seoul
      username: taskTracker
      password: taskTracker
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1800000
jwt:
  issuer: temp                                     #추후 github secrets로 대체
  secret_key: temp-temp-temp-temp-temp-temp-temp   #추후 github secrets로 대체
  access_token_expiration: 900000                  # 15분
  exclude-paths:
    - /api/v1/auth/login
    - /api/v1/auth/join
    - /api/v1/auth/refresh
    - /favicon.ico
