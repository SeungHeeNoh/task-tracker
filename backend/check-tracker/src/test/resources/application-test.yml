server:
  port: 8080

logging:
  level:
    com.hohohehe.checktracker: debug
    org.springframework.web.servlet: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.hibernate.orm.jdbc.bind: trace

spring:
  application:
    name: check-tracker
  datasource:
    hikari:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:taskTracker;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/ddl.sql
  data:
    redis:
      host: localhost
      port: 6379
      password: taskTracker
jwt:
  issuer: temp                                     #추후 github secrets로 대체
  secret_key: temp-temp-temp-temp-temp-temp-temp   #추후 github secrets로 대체
  access_token_expiration: 900000                  # 15분
  refresh_token_expiration: 604800000              # 7일
  exclude-paths:
    - /api/v1/auth/login
    - /api/v1/auth/join
    - /api/v1/auth/refresh
    - /favicon.ico

redis:
  keys:
    user-prefix: 'user:'
    profile-suffix: ':profile'
    token-suffix: ':token'
  ttl:
    profile-ttl: 604810 # 7일 10초 후 삭제
    token-ttl: 604810   # 7일 10초 후 삭제

cors:
  allowed-origins: "http://localhost:5173"